<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#071a1f"/>
      <stop offset="100%" stop-color="#0d2830"/>
    </linearGradient>
    <style>
      .title{font:700 38px 'Arial', sans-serif; fill:#e8f4f2}
      .sub{font:500 18px 'Arial', sans-serif; fill:#93aeb0}
      .label{font:700 22px 'Arial', sans-serif; fill:#e8f4f2}
      .small{font:500 18px 'Arial', sans-serif; fill:#93aeb0}
      .chip{fill:#0f2329; stroke:#2dd4bf; stroke-opacity:.28; stroke-width:2}
      .accent{stroke:#2dd4bf; stroke-width:4; fill:none; marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 z" fill="#2dd4bf"/>
    </marker>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <text x="70" y="80" class="title">AeroRAG-X</text>
  <text x="70" y="116" class="sub">Evidence-grounded aerospace RAG for technical question answering</text>

  <rect x="70" y="180" rx="18" ry="18" width="180" height="100" class="chip"/>
  <text x="160" y="220" text-anchor="middle" class="label">NASA NTRS</text>
  <text x="160" y="248" text-anchor="middle" class="small">PDFs + metadata</text>

  <rect x="330" y="180" rx="18" ry="18" width="220" height="100" class="chip"/>
  <text x="440" y="220" text-anchor="middle" class="label">Chunking</text>
  <text x="440" y="248" text-anchor="middle" class="small">citation-preserving chunks</text>

  <rect x="640" y="150" rx="18" ry="18" width="220" height="90" class="chip"/>
  <text x="750" y="188" text-anchor="middle" class="label">BM25</text>
  <text x="750" y="214" text-anchor="middle" class="small">lexical retrieval</text>

  <rect x="640" y="260" rx="18" ry="18" width="220" height="90" class="chip"/>
  <text x="750" y="298" text-anchor="middle" class="label">Dense retrieval</text>
  <text x="750" y="324" text-anchor="middle" class="small">Sentence Transformers</text>

  <rect x="930" y="205" rx="18" ry="18" width="200" height="90" class="chip"/>
  <text x="1030" y="243" text-anchor="middle" class="label">RRF + reranker</text>
  <text x="1030" y="269" text-anchor="middle" class="small">hybrid ranking</text>

  <rect x="160" y="470" rx="18" ry="18" width="240" height="95" class="chip"/>
  <text x="280" y="508" text-anchor="middle" class="label">Evidence gate</text>
  <text x="280" y="534" text-anchor="middle" class="small">support check + refusal</text>

  <rect x="470" y="470" rx="18" ry="18" width="240" height="95" class="chip"/>
  <text x="590" y="508" text-anchor="middle" class="label">LLM generation</text>
  <text x="590" y="534" text-anchor="middle" class="small">structured cited answer</text>

  <rect x="780" y="470" rx="18" ry="18" width="280" height="95" class="chip"/>
  <text x="920" y="508" text-anchor="middle" class="label">Serving + observability</text>
  <text x="920" y="534" text-anchor="middle" class="small">FastAPI · Docker · Cloud Run · Prometheus</text>

  <path d="M250 230 L330 230" class="accent"/>
  <path d="M550 230 L640 195" class="accent"/>
  <path d="M550 230 L640 305" class="accent"/>
  <path d="M860 195 L930 240" class="accent"/>
  <path d="M860 305 L930 260" class="accent"/>
  <path d="M1030 295 L1030 385 L280 385 L280 470" class="accent"/>
  <path d="M400 517 L470 517" class="accent"/>
  <path d="M710 517 L780 517" class="accent"/>

  <rect x="70" y="650" rx="18" ry="18" width="1060" height="90" fill="#0f2329" stroke="#2dd4bf" stroke-opacity=".18"/>
  <text x="100" y="688" class="label" font-size="20">What this demonstrates</text>
  <text x="100" y="718" class="small">Hybrid retrieval, reranking, grounded generation, honest evaluation, and production ML systems engineering.</text>
</svg>
