<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#071a1f"/>
      <stop offset="100%" stop-color="#0d2830"/>
    </linearGradient>
    <style>
      .title{font:700 38px Arial,sans-serif; fill:#e8f4f2}
      .sub{font:500 18px Arial,sans-serif; fill:#93aeb0}
      .label{font:700 21px Arial,sans-serif; fill:#e8f4f2}
      .small{font:500 16px Arial,sans-serif; fill:#93aeb0}
      .tiny{font:500 15px Arial,sans-serif; fill:#93aeb0}
      .chip{fill:#0f2329; stroke:#2dd4bf; stroke-opacity:.28; stroke-width:2}
      .accent{stroke:#2dd4bf; stroke-width:4; fill:none; marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 z" fill="#2dd4bf"/>
    </marker>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <text x="70" y="80" class="title">AeroRAG-X</text>
  <text x="70" y="116" class="sub">Evidence-grounded aerospace RAG for technical question answering</text>

  <rect x="70" y="180" rx="18" ry="18" width="190" height="104" class="chip"/>
  <text x="165" y="219" text-anchor="middle" class="label">NASA NTRS</text>
  <text x="165" y="249" text-anchor="middle" class="small">PDFs + metadata</text>

  <rect x="330" y="180" rx="18" ry="18" width="230" height="104" class="chip"/>
  <text x="445" y="216" text-anchor="middle" class="label">Chunking</text>
  <text x="445" y="244" text-anchor="middle" class="small">citation-preserving</text>
  <text x="445" y="265" text-anchor="middle" class="small">chunks</text>

  <rect x="650" y="148" rx="18" ry="18" width="220" height="94" class="chip"/>
  <text x="760" y="187" text-anchor="middle" class="label">BM25</text>
  <text x="760" y="216" text-anchor="middle" class="small">lexical retrieval</text>

  <rect x="650" y="264" rx="18" ry="18" width="220" height="94" class="chip"/>
  <text x="760" y="302" text-anchor="middle" class="label">Dense retrieval</text>
  <text x="760" y="330" text-anchor="middle" class="small">sentence-transformer</text>

  <rect x="940" y="205" rx="18" ry="18" width="200" height="94" class="chip"/>
  <text x="1040" y="243" text-anchor="middle" class="label">RRF + reranker</text>
  <text x="1040" y="272" text-anchor="middle" class="small">hybrid ranking</text>

  <rect x="145" y="468" rx="18" ry="18" width="250" height="100" class="chip"/>
  <text x="270" y="507" text-anchor="middle" class="label">Evidence gate</text>
  <text x="270" y="537" text-anchor="middle" class="small">support check + refusal</text>

  <rect x="455" y="468" rx="18" ry="18" width="250" height="100" class="chip"/>
  <text x="580" y="507" text-anchor="middle" class="label">LLM generation</text>
  <text x="580" y="537" text-anchor="middle" class="small">structured cited answer</text>

  <rect x="765" y="456" rx="18" ry="18" width="335" height="124" class="chip"/>
  <text x="932.5" y="496" text-anchor="middle" class="label">Serving + observability</text>
  <text x="932.5" y="528" text-anchor="middle" class="small">FastAPI · Docker · Cloud Run</text>
  <text x="932.5" y="552" text-anchor="middle" class="small">Prometheus</text>

  <path d="M260 232 L330 232" class="accent"/>
  <path d="M560 232 L650 195" class="accent"/>
  <path d="M560 232 L650 311" class="accent"/>
  <path d="M870 195 L940 240" class="accent"/>
  <path d="M870 311 L940 264" class="accent"/>
  <path d="M1040 299 L1040 390 L270 390 L270 468" class="accent"/>
  <path d="M395 518 L455 518" class="accent"/>
  <path d="M705 518 L765 518" class="accent"/>

  <rect x="70" y="650" rx="18" ry="18" width="1060" height="90" fill="#0f2329" stroke="#2dd4bf" stroke-opacity=".18"/>
  <text x="100" y="688" class="label">What this demonstrates</text>
  <text x="100" y="718" class="tiny">Hybrid retrieval, reranking, grounded generation, honest evaluation, and production ML systems engineering.</text>
</svg>