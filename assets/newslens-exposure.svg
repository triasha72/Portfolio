<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="NDCG at 10 by training-exposure band, showing articles never seen as training candidates scoring highest, above a chronological train-validation split timeline">
  <defs>
    <linearGradient id="nlBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#03151a"/>
      <stop offset="55%" stop-color="#062229"/>
      <stop offset="100%" stop-color="#02100f"/>
    </linearGradient>
    <radialGradient id="nlGlowTeal" cx="14%" cy="8%" r="44%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity=".20"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nlGlowAmber" cx="20%" cy="34%" r="34%">
      <stop offset="0%" stop-color="#f5a524" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#f5a524" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nlBarTeal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity=".12"/>
    </linearGradient>
    <linearGradient id="nlBarAmber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5a524" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#f5a524" stop-opacity=".16"/>
    </linearGradient>
    <linearGradient id="nlTrain" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity=".42"/>
    </linearGradient>
  </defs>

  <rect width="900" height="620" fill="url(#nlBg)"/>
  <rect width="900" height="620" fill="url(#nlGlowTeal)"/>
  <rect width="900" height="620" fill="url(#nlGlowAmber)"/>

  <g font-family="'Space Grotesk',sans-serif">

    <!-- heading -->
    <text x="60" y="66" fill="#96bcbe" fill-opacity=".85" font-size="11.5" letter-spacing="2.6">NDCG@10 BY TRAINING-EXPOSURE BAND</text>
    <text x="60" y="96" fill="#eefbfa" font-size="21" letter-spacing="-.4" font-weight="700">Least-seen articles rank best</text>

    <!-- gridlines -->
    <g stroke="#8beee0" stroke-opacity=".13" stroke-width="1">
      <line x1="118" y1="440" x2="600" y2="440"/>
      <line x1="118" y1="373" x2="600" y2="373" stroke-dasharray="3 6"/>
      <line x1="118" y1="307" x2="600" y2="307" stroke-dasharray="3 6"/>
      <line x1="118" y1="240" x2="600" y2="240" stroke-dasharray="3 6"/>
      <line x1="118" y1="173" x2="600" y2="173" stroke-dasharray="3 6"/>
    </g>
    <g fill="#96bcbe" fill-opacity=".6" font-size="10" text-anchor="end">
      <text x="108" y="444">0</text>
      <text x="108" y="377">0.10</text>
      <text x="108" y="311">0.20</text>
      <text x="108" y="244">0.30</text>
      <text x="108" y="177">0.40</text>
    </g>

    <!-- bars: value/0.45 * 300px, baseline y=440 -->
    <!-- unseen 0.3924 -->
    <rect x="130" y="178" width="78" height="262" rx="5" fill="url(#nlBarAmber)" stroke="#f5a524" stroke-opacity=".55" stroke-width="1.2"/>
    <text x="169" y="168" fill="#ffc46b" font-size="15" font-weight="700" text-anchor="middle">0.3924</text>
    <!-- low 0.2807 -->
    <rect x="238" y="253" width="78" height="187" rx="5" fill="url(#nlBarTeal)" stroke="#8beee0" stroke-opacity=".32" stroke-width="1.2"/>
    <text x="277" y="243" fill="#8beee0" font-size="14" text-anchor="middle">0.2807</text>
    <!-- medium 0.2916 -->
    <rect x="346" y="246" width="78" height="194" rx="5" fill="url(#nlBarTeal)" stroke="#8beee0" stroke-opacity=".32" stroke-width="1.2"/>
    <text x="385" y="236" fill="#8beee0" font-size="14" text-anchor="middle">0.2916</text>
    <!-- high 0.2740 -->
    <rect x="454" y="257" width="78" height="183" rx="5" fill="url(#nlBarTeal)" stroke="#8beee0" stroke-opacity=".32" stroke-width="1.2"/>
    <text x="493" y="247" fill="#8beee0" font-size="14" text-anchor="middle">0.2740</text>

    <!-- x labels -->
    <g text-anchor="middle" font-size="10.5" letter-spacing="1.4">
      <text x="169" y="462" fill="#ffc46b" fill-opacity=".95">UNSEEN</text>
      <text x="277" y="462" fill="#96bcbe" fill-opacity=".85">LOW</text>
      <text x="385" y="462" fill="#96bcbe" fill-opacity=".85">MEDIUM</text>
      <text x="493" y="462" fill="#96bcbe" fill-opacity=".85">HIGH</text>
    </g>
    <g text-anchor="middle" font-size="9.5" fill="#96bcbe" fill-opacity=".55">
      <text x="169" y="478">0 exposures</text>
      <text x="277" y="478">1&#8211;9</text>
      <text x="385" y="478">10&#8211;99</text>
      <text x="493" y="478">100+</text>
    </g>

    <!-- side stat panel -->
    <g transform="translate(632,132)">
      <rect x="0" y="0" width="212" height="222" rx="16" fill="#8beee0" fill-opacity=".035" stroke="#8beee0" stroke-opacity=".16" stroke-width="1"/>
      <text x="20" y="34" fill="#f5a524" font-size="10" letter-spacing="2.2">SELECTED MODEL</text>

      <text x="20" y="70" fill="#96bcbe" fill-opacity=".8" font-size="10.5">NDCG@10</text>
      <text x="192" y="70" fill="#eefbfa" font-size="15" font-weight="700" text-anchor="end">0.3664</text>
      <line x1="20" y1="82" x2="192" y2="82" stroke="#8beee0" stroke-opacity=".12"/>

      <text x="20" y="110" fill="#96bcbe" fill-opacity=".8" font-size="10.5">vs content-only</text>
      <text x="192" y="110" fill="#8beee0" font-size="15" font-weight="700" text-anchor="end">+0.0069</text>
      <line x1="20" y1="122" x2="192" y2="122" stroke="#8beee0" stroke-opacity=".12"/>

      <text x="20" y="150" fill="#96bcbe" fill-opacity=".8" font-size="10.5">95% CI</text>
      <text x="192" y="150" fill="#8beee0" font-size="12.5" text-anchor="end">[0.0058, 0.0081]</text>
      <line x1="20" y1="162" x2="192" y2="162" stroke="#8beee0" stroke-opacity=".12"/>

      <text x="20" y="190" fill="#96bcbe" fill-opacity=".8" font-size="10.5">empty rankings</text>
      <text x="192" y="190" fill="#eefbfa" font-size="15" font-weight="700" text-anchor="end">927 &#8594; 0</text>
    </g>

    <!-- chronological split timeline -->
    <text x="60" y="524" fill="#96bcbe" fill-opacity=".85" font-size="10.5" letter-spacing="2.4">CHRONOLOGICAL SPLIT &#183; NO TEMPORAL OVERLAP</text>

    <rect x="60" y="540" width="628" height="30" rx="7" fill="url(#nlTrain)" stroke="#8beee0" stroke-opacity=".22" stroke-width="1"/>
    <rect x="688" y="540" width="152" height="30" rx="7" fill="#f5a524" fill-opacity=".16" stroke="#f5a524" stroke-opacity=".45" stroke-width="1"/>

    <line x1="688" y1="530" x2="688" y2="586" stroke="#f5a524" stroke-opacity=".7" stroke-width="1.4"/>
    <circle cx="688" cy="530" r="3" fill="#f5a524"/>

    <text x="76" y="560" fill="#d3efec" font-size="12" font-weight="700">125,572 training impressions</text>
    <text x="704" y="560" fill="#ffc46b" font-size="12" font-weight="700">31,393 held out</text>

    <text x="688" y="600" fill="#96bcbe" fill-opacity=".7" font-size="10" text-anchor="middle">cutoff 2019-11-13 20:36:26</text>

  </g>
</svg>
