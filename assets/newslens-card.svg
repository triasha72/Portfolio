<svg viewBox="0 0 820 820" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="NDCG at 10 by training-exposure band: articles never shown as training candidates score 0.3924, above every band of articles that were shown">
  <defs>
    <linearGradient id="cBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#03151a"/>
      <stop offset="55%" stop-color="#062229"/>
      <stop offset="100%" stop-color="#02100f"/>
    </linearGradient>
    <radialGradient id="cGlowTeal" cx="16%" cy="6%" r="46%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity=".20"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cGlowAmber" cx="22%" cy="40%" r="38%">
      <stop offset="0%" stop-color="#f5a524" stop-opacity=".15"/>
      <stop offset="100%" stop-color="#f5a524" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cBarTeal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity=".52"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity=".10"/>
    </linearGradient>
    <linearGradient id="cBarAmber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5a524" stop-opacity=".88"/>
      <stop offset="100%" stop-color="#f5a524" stop-opacity=".14"/>
    </linearGradient>
  </defs>

  <rect width="820" height="820" fill="url(#cBg)"/>
  <rect width="820" height="820" fill="url(#cGlowTeal)"/>
  <rect width="820" height="820" fill="url(#cGlowAmber)"/>

  <g font-family="'Space Grotesk',sans-serif">

    <!-- heading, inside the safe zone -->
    <text x="118" y="118" fill="#f5a524" font-size="15" letter-spacing="3.4">NDCG@10 BY TRAINING EXPOSURE</text>
    <text x="118" y="168" fill="#eefbfa" font-size="38" font-weight="700" letter-spacing="-1.2">Least-seen ranks best</text>

    <!-- gridlines -->
    <g stroke="#8beee0" stroke-opacity=".12" stroke-width="1.2">
      <line x1="118" y1="620" x2="706" y2="620" stroke-opacity=".3"/>
      <line x1="118" y1="536" x2="706" y2="536" stroke-dasharray="4 8"/>
      <line x1="118" y1="451" x2="706" y2="451" stroke-dasharray="4 8"/>
      <line x1="118" y1="367" x2="706" y2="367" stroke-dasharray="4 8"/>
      <line x1="118" y1="282" x2="706" y2="282" stroke-dasharray="4 8"/>
    </g>

    <!-- bars: value/0.45*380, baseline 620 -->
    <rect x="130" y="289" width="110" height="331" rx="7" fill="url(#cBarAmber)" stroke="#f5a524" stroke-opacity=".6" stroke-width="1.6"/>
    <text x="185" y="272" fill="#ffc46b" font-size="30" font-weight="700" text-anchor="middle">0.3924</text>

    <rect x="280" y="383" width="110" height="237" rx="7" fill="url(#cBarTeal)" stroke="#8beee0" stroke-opacity=".30" stroke-width="1.6"/>
    <text x="335" y="366" fill="#8beee0" font-size="24" text-anchor="middle">0.2807</text>

    <rect x="430" y="374" width="110" height="246" rx="7" fill="url(#cBarTeal)" stroke="#8beee0" stroke-opacity=".30" stroke-width="1.6"/>
    <text x="485" y="357" fill="#8beee0" font-size="24" text-anchor="middle">0.2916</text>

    <rect x="580" y="389" width="110" height="231" rx="7" fill="url(#cBarTeal)" stroke="#8beee0" stroke-opacity=".30" stroke-width="1.6"/>
    <text x="635" y="372" fill="#8beee0" font-size="24" text-anchor="middle">0.2740</text>

    <!-- band labels -->
    <g text-anchor="middle" font-size="15" letter-spacing="2">
      <text x="185" y="654" fill="#ffc46b">UNSEEN</text>
      <text x="335" y="654" fill="#96bcbe">LOW</text>
      <text x="485" y="654" fill="#96bcbe">MEDIUM</text>
      <text x="635" y="654" fill="#96bcbe">HIGH</text>
    </g>
    <g text-anchor="middle" font-size="13.5" fill="#96bcbe" fill-opacity=".62">
      <text x="185" y="680">0 exposures</text>
      <text x="335" y="680">1&#8211;9</text>
      <text x="485" y="680">10&#8211;99</text>
      <text x="635" y="680">100+</text>
    </g>

    <!-- footer line -->
    <line x1="118" y1="716" x2="706" y2="716" stroke="#8beee0" stroke-opacity=".14" stroke-width="1"/>
    <text x="118" y="752" fill="#96bcbe" fill-opacity=".85" font-size="14.5" letter-spacing="1.4">Chronological split &#183; 31,393 impressions held out</text>

  </g>
</svg>
